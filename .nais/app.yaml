apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: spill-av-im
  namespace: tbd
  labels:
    team: tbd
spec:
  strategy:
    type: RollingUpdate
  replicas:
    min: 2
    max: 24
    scalingStrategy:
      kafka:
        topic: tbd.rapid.v1
        consumerGroup: tbd-spill-av-im-v1
        threshold: 200
  liveness:
    path: /isalive
  readiness:
    path: /isready
  prometheus:
    enabled: true
    path: /metrics
  preStopHook:
    http:
      path: /stop
  accessPolicy:
    outbound:
      rules:
        - application: logging
          namespace: nais-system
  env:
    - name: KAFKA_RAPID_TOPIC
      value: tbd.rapid.v1
    - name: KAFKA_CONSUMER_GROUP_ID
      value: tbd-spill-av-im-v1
    - name: KAFKA_RESET_POLICY
      value: EARLIEST
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
