name: main - matching - Bygg, test og publiser

on:
  push:
    branches:
      - main
    paths:
      # Selve modulen - alt unntatt dokumentasjon
      - 'matching/**'
      - '!matching/**.md'
      # Fellesoppsett som påvirker byggingen av modulen
      - 'gradle/**'
      - 'gradle.properties'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradlew'
      - 'gradlew.bat'
      # Workflowen som bygger og publiserer modulen
      - '.github/workflows/main-matching.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bygg-test-og-publiser:
    name: Bygg, test og publiser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Generer versjon
        id: versjon
        run: |
          VERSJON="$(TZ=Europe/Oslo date +%Y.%m.%d-%H.%M)-$(git rev-parse --short=8 HEAD)"
          echo "## Versjon $VERSJON" >> "$GITHUB_STEP_SUMMARY"
          echo "versjon=$VERSJON" >> "$GITHUB_OUTPUT"

      - name: gradlew build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --build-cache :matching:build

      - name: gradlew publish
        env:
          VERSJON: ${{ steps.versjon.outputs.versjon }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew --build-cache -Pversion="$VERSJON" :matching:publish
